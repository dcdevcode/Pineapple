<div class="app-shell">
  <app-brand class="app-shell__brand" />
  <mat-tab-group class="app-tabs" [mat-stretch-tabs]="false" animationDuration="0ms">
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="app-tab__icon" aria-hidden="true">phone_iphone</mat-icon>
        <span class="app-tab__label">Device</span>
      </ng-template>
      <app-device />
    </mat-tab>
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="app-tab__icon" aria-hidden="true">manage_search</mat-icon>
        <span class="app-tab__label">Analysis</span>
      </ng-template>
      <app-analysis />
    </mat-tab>
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="app-tab__icon" aria-hidden="true">info</mat-icon>
        <span class="app-tab__label">About</span>
      </ng-template>
      <app-about />
    </mat-tab>
  </mat-tab-group>
</div>
