<div class="table">
  <!-- Toolbar: an optional projected [tableFilter] control on the left, Search on
       the right. Only rendered for a searchable table (every section that
       projects a filter is also searchable). -->
  @if (searchable()) {
    <div class="table__toolbar">
      <ng-content select="[tableFilter]" />
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="table__search">
        <mat-label>Search</mat-label>
        <input matInput [ngModel]="search()" (ngModelChange)="onSearch($event)" />
      </mat-form-field>
    </div>
  }

  <div class="table__status">
    @if (loading()) {
      <mat-progress-bar mode="indeterminate" />
    }
    @if (error()) {
      <p class="table__error">{{ error() }}</p>
    }
  </div>

  <div class="table__scroll">
    <table mat-table [dataSource]="rows()">
      @for (column of columns(); track column.key) {
        <ng-container [matColumnDef]="column.key">
          <th mat-header-cell *matHeaderCellDef [class.table__num]="column.numeric">
            {{ column.label }}
          </th>
          <td mat-cell *matCellDef="let row" [class.table__num]="column.numeric">
            {{ cell(row, column) }}
          </td>
        </ng-container>
      }
      <tr mat-header-row *matHeaderRowDef="displayColumns()"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayColumns()"
        [class.table__row--interactive]="interactive"
        [attr.role]="interactive ? 'button' : null"
        [attr.tabindex]="interactive ? 0 : null"
        (click)="interactive && openDetail(row)"
        (keydown.enter)="interactive && openDetail(row)"
      ></tr>
    </table>

    @if (!loading() && !error() && rows().length === 0) {
      <p class="table__empty">Nothing to show.</p>
    }
  </div>

  <mat-paginator
    [length]="total()"
    [pageIndex]="index()"
    [pageSize]="size()"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPage($event)"
  />
</div>
