<div class="safari">
  <mat-button-toggle-group
    class="safari__switch"
    [ngModel]="view()"
    (ngModelChange)="view.set($event)"
    hideSingleSelectionIndicator
  >
    <mat-button-toggle value="history">History</mat-button-toggle>
    <mat-button-toggle value="bookmarks">Bookmarks</mat-button-toggle>
  </mat-button-toggle-group>

  @if (view() === 'history') {
    <app-artifact-table
      class="safari__table"
      [columns]="historyColumns"
      [fetchPage]="fetchHistory"
      [searchable]="true"
      [detailFields]="historyDetail"
      [detailTitle]="urlTitle"
    />
  } @else {
    <app-artifact-table
      class="safari__table"
      [columns]="bookmarkColumns"
      [fetchPage]="fetchBookmarks"
      [searchable]="true"
      [detailFields]="bookmarkDetail"
      [detailTitle]="urlTitle"
    />
  }
</div>
