<div class="whatsapp">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="whatsapp__chat">
    <mat-label>Chat</mat-label>
    <mat-select [ngModel]="chat()" (ngModelChange)="chat.set($event)">
      <mat-option value="">All chats</mat-option>
      @for (item of chats(); track item.rowid) {
        <mat-option [value]="item.jid">
          {{ item.name || item.jid }} ({{ item.message_count }})
        </mat-option>
      }
    </mat-select>
  </mat-form-field>

  <app-artifact-table
    class="whatsapp__table"
    [columns]="columns"
    [fetchPage]="fetch"
    [searchable]="true"
    [scope]="chat()"
    [detailFields]="detail"
    [detailTitle]="title"
  />
</div>
