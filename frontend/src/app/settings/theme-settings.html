<h3 class="theme-settings__heading">Theme</h3>
<p class="theme-settings__hint">Choose how Pineapple looks.</p>

<mat-radio-group
  class="theme-settings__options"
  aria-label="Theme"
  [ngModel]="preference()"
  (ngModelChange)="select($event)"
>
  <mat-radio-button value="light">Light</mat-radio-button>
  <mat-radio-button value="dark">Dark</mat-radio-button>
  <mat-radio-button value="system">
    System
    <span class="theme-settings__note">Follow the operating system</span>
  </mat-radio-button>
</mat-radio-group>
