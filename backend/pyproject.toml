[project]
name = "pineapple"
version = "0.1.0"
description = "iOS forensic analysis tool - backend"
authors = [
    { name = "dcdevcode", email = "305354676+dcdevcode@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "iphone-backup-decrypt>=0.9.0",
    "pymobiledevice3>=11.2.1",
    "pytypedstream>=0.1.0",
    "pywebview>=5.4",
]

[project.scripts]
pineapple-gui = "pineapple.app:run"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["iphone_backup_decrypt.*", "typedstream.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
